[package]
name = "oxide-route"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Ultra-low-latency Rust LLM Router and API Gateway"
default-run = "oxide"

[[bin]]
name = "oxide"
path = "src/main.rs"

# Benchmark driver; see bench/run.sh and docs/BENCHMARK_REPORT.md.
[[bin]]
name = "loadgen"
path = "tools/loadgen.rs"

[dependencies]
# Async Runtime & HTTP Proxy Layer
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["http2", "macros"] }
hyper = { version = "1.4", features = ["full"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
http = "1.1"
http-body-util = "0.1"
bytes = "1.7"
futures-core = "0.3"
futures-util = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"

# Upstream HTTP/2 Client with Rustls
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "stream",
    "json"
] }

# Serialization, SIMD JSON Inspection & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.14"
toml = "0.8"
schemars = "0.8"
regex = "1.11"

# AWS SigV4 signing for the Bedrock adapter
hmac = "0.12"
sha2 = "0.10"

# Lock-Free Concurrency, Caching & Rate Limiting
arc-swap = "1.7"
dashmap = "6.1"
governor = "0.6"
moka = { version = "0.12", features = ["future"] }
notify = "6.1"

# CLI, Diagnostics & Telemetry
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "1.0"
miette = { version = "7.2", features = ["fancy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# OpenTelemetry OTLP trace export (enabled when telemetry.otlp_endpoint is set)
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "0.34"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
rand = "0.8"

[[bench]]
name = "latency"
harness = false

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
criterion = { version = "0.5", features = ["async_tokio"] }
